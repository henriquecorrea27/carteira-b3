[project]
name = "carteira-b3"
version = "0.1.0"
description = "Personal B3 portfolio tracker, corporate events, rule-based stock analysis and Discord reports"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "apscheduler<4",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    # pandas 2.3+/3.x DLLs are blocked by Windows Smart App Control on the dev machine
    "pandas==2.2.3",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0",
    "uvicorn>=0.54.0",
    "watchfiles>=1.3.0",
    "yfinance>=1.7.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
